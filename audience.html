<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chem Illustrator slide show</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    body.no-cursor { cursor: none; }
    #wait { position: fixed; inset: 0; display: grid; place-items: center; color: #aaa; font: 16px system-ui, sans-serif; text-align: center; padding: 24px; }
    #wait[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="wait">Waiting for the slides…</div>
  <script type="module" src="/src/audience.ts"></script>
</body>
</html>
