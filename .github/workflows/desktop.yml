name: Desktop app

# Builds the installers for Windows, macOS and Linux when something is merged into main, or on
# request (Actions > Desktop app > Run workflow, which can build any branch). Not on every pull
# request: the Checks workflow already tests every pull request.
#
# Each build of main is published as a release (Releases on the repository's page) with a
# latest.json file, which is what the app's File > Check for Updates reads. The installers are
# signed for the updater with the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and
# variables > Actions); without that secret the builds still run but nothing is published.
#
# While the repository is public the builds cost nothing. If it is ever made private again, only
# Windows is built (macOS minutes count ten times against the free allowance), unless a run is
# started by hand with "All platforms" ticked.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: All platforms (Windows, macOS and Linux)
        type: boolean
        default: true

permissions:
  contents: write # to publish releases

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - id: pick
        env:
          PRIVATE: ${{ github.event.repository.private }}
          ALL: ${{ inputs.all }}
          SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          win='{"platform":"windows","os":"windows-latest","args":""}'
          mac='{"platform":"macos","os":"macos-latest","args":"--target universal-apple-darwin"}'
          lin='{"platform":"linux","os":"ubuntu-22.04","args":""}'
          if [ "$PRIVATE" = "true" ] && [ "$ALL" != "true" ]; then list="[$win]"; else list="[$win,$mac,$lin]"; fi
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$SIGNED" = "true" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      RELEASE: ${{ needs.plan.outputs.release }}
      # 0.1.<build number>: each build of main is newer than the one before
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install what Linux builds need
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Number this version
        shell: bash
        run: node scripts/release.mjs prepare "$VERSION" "$RELEASE"
      - name: Build the app and its installers
        run: npm run desktop:build -- ${{ matrix.args }}
      - name: Start the app and run its self-test
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $env:CHEM_ILLUSTRATOR_SELFTEST = $report
          $p = Start-Process -FilePath 'src-tauri\target\release\chem-illustrator.exe' -PassThru
          $null = $p.Handle  # needed for ExitCode to be filled in
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'The app did not finish its self-test within 150 s' }
          if (Test-Path $report) { Get-Content $report } else { Write-Host 'No report was written' }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
      - name: Sign the portable app for the updater
        # the installers are signed by the build; the bare app, which portable copies update
        # from, is signed here with the same key
        if: matrix.platform == 'windows' && env.RELEASE == 'true'
        shell: bash
        run: npx tauri signer sign --app-version "$VERSION" src-tauri/target/release/chem-illustrator.exe
      - name: Gather the installers
        shell: bash
        run: node scripts/release.mjs collect "$VERSION" ${{ matrix.platform }} out
      - uses: actions/upload-artifact@v4
        with:
          name: chem-illustrator-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          # installers are 10 to 30 MB each; keep them a week so they stay under the free storage
          retention-days: 7

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # One publish at a time, so two merges close together can't both decide which release is
    # "latest" at once. (GitHub keeps one waiting publish; if a third merge's publish arrives
    # while one is waiting, the waiting one is dropped and that build is not published, which
    # is harmless because the newer one replaces it.)
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          node scripts/release.mjs manifest "$VERSION" "$RUNNER_TEMP/notes.txt" out
          # the signatures are inside latest.json; the release lists the installers
          # not marked "latest" yet: builds can finish out of order, and an older one must not
          # take "latest" (and so the updater's latest.json) from a newer one
          gh release create "v$VERSION" $(ls out/* | grep -v '\.sig$') --title "Chem Illustrator $VERSION (beta)" --notes-file "$RUNNER_TEMP/notes.txt" --target "$GITHUB_SHA" --latest=false
      - name: Mark the highest version as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName > "$RUNNER_TEMP/releases.json"
          newest=$(node scripts/release.mjs newest "$VERSION" "$RUNNER_TEMP/releases.json")
          gh release edit "$newest" --latest
          echo "Latest release: $newest"
