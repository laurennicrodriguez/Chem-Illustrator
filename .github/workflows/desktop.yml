name: Desktop app

# Builds the Windows installer when something is merged into main, or on request (Actions >
# Desktop app > Run workflow, which can build any branch). Not on every pull request: Windows
# build time counts double against the free allowance, and the Checks workflow already tests
# every pull request.
#
# Each build of main is published as a release (Releases on the repository's page) with a
# latest.json file, which is what the app's File > Check for Updates reads. The installer is
# signed for the updater with the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and
# variables > Actions); without that secret the build still runs but nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish releases

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      RELEASE: ${{ github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Number this version
        shell: pwsh
        run: |
          # 0.1.<build number>: each build of main is newer than the one before
          $base = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version -replace '\.\d+$', ''
          $version = "$base.${{ github.run_number }}"
          "VERSION=$version" >> $env:GITHUB_ENV
          node scripts/release.mjs prepare $version $env:RELEASE
      - name: Build the app and its installers
        run: npm run desktop:build
      - name: Start the app and run its self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $env:CHEM_ILLUSTRATOR_SELFTEST = $report
          $p = Start-Process -FilePath 'src-tauri\target\release\chem-illustrator.exe' -PassThru
          $null = $p.Handle  # needed for ExitCode to be filled in
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'The app did not finish its self-test within 150 s' }
          if (Test-Path $report) { Get-Content $report } else { Write-Host 'No report was written' }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
      - name: Publish the release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'notes.txt'
          Set-Content -Path $notes -Value $env:NOTES -Encoding utf8
          $out = Join-Path $env:RUNNER_TEMP 'release'
          node scripts/release.mjs manifest $env:VERSION $notes $out
          gh release create "v$env:VERSION" (Get-ChildItem $out).FullName --title "Chem Illustrator $env:VERSION" --notes-file $notes --target $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        if: env.RELEASE != 'true'
        with:
          name: chem-illustrator-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          # installers are 20 MB each; keep them a week so they stay under the free storage
          retention-days: 7
