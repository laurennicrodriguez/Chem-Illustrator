[package]
name = "chem-illustrator"
version = "0.1.0"
description = "Chem Illustrator: fast chemical structure drawing"
repository = "https://github.com/nathanohare/chem-illustrator"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chem_illustrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
